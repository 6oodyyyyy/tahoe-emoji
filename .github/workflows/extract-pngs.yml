name: Extract CharacterPicker Icon PNGs

on:
  workflow_dispatch:

jobs:
  extract-pngs:
    runs-on: macos-latest
    steps:
      - name: Copy Assets.car
        run: |
          CAR_PATH="/System/Library/PrivateFrameworks/CharacterPicker.framework/Versions/A/Resources/Assets.car"
          cp "$CAR_PATH" ./Assets.car
          ls -lh ./Assets.car

      - name: Extract PNGs using Python
        run: |
          python3 << 'PYEOF'
          # Parse the .car file and extract images
          # The .car is a BOMStore. Let's use a simple approach:
          # Search for PNG/JPEG data within the .car
          
          import os
          import re
          
          with open('./Assets.car', 'rb') as f:
              data = f.read()
          
          print(f"CAR file size: {len(data)} bytes")
          
          # Find all PNGs
          png_magic = b'\x89PNG\r\n\x1a\n'
          png_end = b'IEND\xae\x42\x60\x82'
          
          os.makedirs('./icons', exist_ok=True)
          count = 0
          start = 0
          while True:
              idx = data.find(png_magic, start)
              if idx == -1:
                  break
              # Find IEND
              end_idx = data.find(png_end, idx)
              if end_idx != -1:
                  end_idx += 8  # Include IEND chunk
                  png_data = data[idx:end_idx]
                  with open(f'./icons/icon_{count}.png', 'wb') as out:
                      out.write(png_data)
                  print(f"Extracted PNG {count}: {len(png_data)} bytes at offset {idx}")
                  count += 1
              start = idx + 1
          
          print(f"Total PNGs extracted: {count}")
          
          # Also try JPEGs
          jpg_magic = b'\xff\xd8\xff'
          jpg_end = b'\xff\xd9'
          start = 0
          jcount = 0
          while True:
              idx = data.find(jpg_magic, start)
              if idx == -1:
                  break
              end_idx = data.find(jpg_end, idx)
              if end_idx != -1:
                  end_idx += 2
                  jpg_data = data[idx:end_idx]
                  # Only save if reasonable size (>1KB, <1MB)
                  if 1024 < len(jpg_data) < 1024*1024:
                      with open(f'./icons/icon_jpg_{jcount}.jpg', 'wb') as out:
                          out.write(jpg_data)
                      print(f"Extracted JPEG {jcount}: {len(jpg_data)} bytes")
                      jcount += 1
              start = idx + 1
          print(f"Total JPEGs extracted: {jcount}")
          PYEOF
          ls -lh ./icons/

      - name: List asset names
        run: |
          # Get asset names from the car file
          strings ./Assets.car | grep -i -E "clock|smiley|face|dog|puppy|apple|soccer|ball|car|bulb|heart|flag|chevron" | head -30

      - name: Upload icons
        uses: actions/upload-artifact@v4
        with:
          name: characterpicker-icons
          path: ./icons/
