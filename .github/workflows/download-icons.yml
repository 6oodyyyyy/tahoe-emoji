name: Download CharacterPicker Category Icons

on:
  workflow_dispatch:

jobs:
  download-icons:
    runs-on: macos-latest
    steps:
      - name: Copy all category icons
        run: |
          RES="/System/Library/PrivateFrameworks/CharacterPicker.framework/Versions/A/Resources"
          mkdir -p ./category-icons
          cp "$RES"/CPKCategoryImage-Favorites.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/CPKCategoryImage-Recents.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/CPToolbarItemImage.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/CategoryArrows-left.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/CategoryArrows-right.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiCategoryActivity.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiCategoryFlags.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiCategoryFoodAndDrink.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiCategoryNature.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiCategoryObjects.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiCategoryPeople.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiCategoryRecents.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiCategorySymbols.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiCategoryTravelAndPlaces.tiff ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategoryActivity.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategoryFlags.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategoryFoodAndDrink.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategoryNature.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategoryObjects.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategoryPeople.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategoryRecents.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategorySymbols.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategoryTravelAndPlaces.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategory_ExpandToLeft.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/EmojiIMCategory_ExpandToRight.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/SymbolsCategoryBullets.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/SymbolsCategoryLetterlike.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/SymbolsCategoryPictographs.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/SymbolsCategorySignStandard.pdf ./category-icons/ 2>/dev/null || true
          cp "$RES"/SymbolsCategoryTechnical.pdf ./category-icons/ 2>/dev/null || true
          ls -lh ./category-icons/
          echo "Total files: $(ls ./category-icons/ | wc -l)"

      - name: Upload icons
        uses: actions/upload-artifact@v4
        with:
          name: category-icons
          path: ./category-icons/
